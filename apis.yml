aid: humana
name: Humana
description: Humana is a U.S. health insurance company that provides Medicare, Medicaid,
  and employer-sponsored health insurance plans, along with wellness programs and
  healthcare services. Humana publishes a suite of FHIR-compliant APIs that give third-party
  applications access to member health data, coverage information, drug formularies,
  and provider directories under CMS interoperability rules.
